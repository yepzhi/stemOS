<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stemOS Dev Studio — Explorador de Contenidos & Módulos</title>
  <meta name="description" content="Entorno de desarrollo e inspección de contenidos de stemOS LXP para nearshoring e industria avanzada.">

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="/dev.css?v=3.0.0">
</head>

<body>

  <!-- Liquid Gooey Ambient Background Mesh -->
  <div class="ambient-glow-mesh" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="studio-container">
    <!-- Header & Brand Bar -->
    <header class="studio-header">
      <div class="brand-title">
        <div class="brand-logo">
          <i class="fa-solid fa-microchip"></i>
        </div>
        <div class="brand-text">
          <div style="display:flex; align-items:center; gap:10px;">
            <h1 class="brand-heading">stemOS Dev Studio</h1>
            <span id="version-badge" class="badge-version">v3.0 PRO</span>
          </div>
          <p class="brand-subtitle">Catálogo Maestro de Contenidos & Módulos Industriales ESP (Nearshoring Hub)</p>
        </div>
      </div>

      <div class="header-badges">
        <!-- CEFR English Level Switcher (A2 / B1) -->
        <div class="cefr-header-pill" id="level-switcher-card">
          <span class="cefr-pill-label"><i class="fa-solid fa-language"></i> Nivel CEFR:</span>
          <div class="level-switcher-pill" id="level-switcher-pill">
            <button class="level-btn active" id="btn-level-a2" data-level="A2" title="Nivel A2: Vocabulario básico-intermedio, oraciones directas e inglés funcional">A2 Básico</button>
            <button class="level-btn" id="btn-level-b1" data-level="B1" title="Nivel B1: Vocabulario técnico avanzado, reportes ejecutivos e modismos de Nearshoring">B1 Técnico</button>
          </div>
        </div>

        <div class="stat-chip stat-chip-tracks">
          <i class="fa-solid fa-network-wired"></i>
          <div>
            <div class="val" id="stat-tracks">26</div>
            <div class="lbl">Tracks ESP</div>
          </div>
        </div>

        <div class="stat-chip stat-chip-modules">
          <i class="fa-solid fa-cubes-stacked"></i>
          <div>
            <div class="val" id="stat-modules">--</div>
            <div class="lbl">Módulos</div>
          </div>
        </div>

        <div class="stat-chip stat-chip-readings">
          <i class="fa-solid fa-book-open-reader"></i>
          <div>
            <div class="val" id="stat-readings">0</div>
            <div class="lbl">Lecturas</div>
          </div>
        </div>

        <div class="stat-chip stat-chip-phrases">
          <i class="fa-solid fa-comments"></i>
          <div>
            <div class="val" id="stat-phrases">0</div>
            <div class="lbl">Frases Nativas</div>
          </div>
        </div>
      </div>
    </header>

    <!-- Search & Filter Controls -->
    <div class="controls-bar">
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="studio-search" class="search-input" placeholder="Buscar por módulo, término clave, alineación (CONOCER/NGSS), proceso o ID..." autocomplete="off">
      </div>

      <div class="track-filters" id="track-filters">
        <!-- Filter buttons dynamically injected here -->
      </div>
    </div>

    <!-- Main Modules Grid -->
    <main id="studio-grid">
      <!-- Track sections and module cards dynamically injected here -->
    </main>
  </div>

  <!-- Drawer Modal Reader -->
  <div class="drawer-backdrop" id="drawer-backdrop" role="dialog" aria-modal="true" aria-labelledby="drawer-mod-title">
    <div class="drawer-panel" id="drawer-panel">
      <div class="drawer-header">
        <div>
          <h2 class="drawer-title-heading" id="drawer-mod-title">Detalle del Módulo</h2>
          <p id="drawer-mod-sub" class="drawer-subtitle-text">Track Industrial • ID</p>
        </div>
        <button class="drawer-close-btn" id="drawer-close" aria-label="Cerrar visor">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <div class="drawer-body" id="drawer-body">
        <!-- Readings, Glossary and Socratic Questions injected here -->
      </div>
    </div>
  </div>

  <!-- Load stemOS courses database, phrases library, and dev controller with cache buster -->
  <script src="/content/courses.js?v=3.0.0"></script>
  <script src="/content/phrases_library.js?v=3.0.0"></script>
  <script src="/dev.js?v=3.0.0"></script>

</body>

</html>
