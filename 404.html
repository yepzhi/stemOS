<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Página no encontrada — stemOS</title>
  <link rel="icon" type="image/svg+xml" href="/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 24px;
      padding: 48px 36px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 3.5rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 12px;
      line-height: 1;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #14b8a6, #0284c7);
      color: white;
      text-decoration: none;
      padding: 12px 28px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>El recurso que buscas no existe o ha sido reubicado en la plataforma académica stemOS.</p>
    <a href="/index.html" class="btn">Volver al Inicio</a>
  </div>
</body>
</html>
