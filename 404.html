<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo a stemOS...</title>
  <script>
    (function() {
      var path = window.location.pathname.toLowerCase();
      if (path === '/dev' || path === '/dev/' || path.startsWith('/dev')) {
        window.location.replace('/dev/index.html');
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body>
  <p>Redirigiendo...</p>
</body>
</html>
