<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="stemGlowMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Full Bleed Background (Edge-to-Edge for OS Masking) -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Safe-Zone Concentric Circuit Pattern -->
  <circle cx="256" cy="240" r="130" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M120 240h272M256 100v280" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>

  <!-- stemOS Isometric Prism Emblem (Fits in 80% Safe Zone) -->
  <g filter="url(#glowMask)">
    <path d="M256 120L364 182v124l-108 62-108-62V182l108-62z" fill="rgba(2, 132, 199, 0.22)" stroke="url(#stemGlowMask)" stroke-width="6.5" stroke-linejoin="round"/>
    <path d="M256 368V250M364 182L256 250M148 182l108 68" stroke="url(#stemGlowMask)" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="256" cy="250" r="22" fill="#38bdf8" filter="url(#glowMask)"/>
    <circle cx="256" cy="250" r="8" fill="#ffffff"/>
  </g>

  <!-- Typography inside safe zone -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="36" fill="#f8fafc" text-anchor="middle" letter-spacing="3">stem<tspan fill="#38bdf8">OS</tspan></text>
</svg>
