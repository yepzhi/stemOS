<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="softGlowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Full Bleed Background (Edge-to-Edge for OS Masking) -->
  <rect width="512" height="512" fill="url(#bgGradMask)"/>

  <!-- Authentic stemOS Brand Mark within 80% Safe Zone -->
  <g filter="url(#softGlowMask)">
    <text x="256" y="290" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="96" text-anchor="middle" letter-spacing="-2.5">
      <tspan fill="#f8fafc">stem</tspan><tspan fill="url(#cyanGradMask)">OS</tspan><tspan fill="url(#cyanGradMask)" font-size="40" font-weight="700" dy="-40">&#174;</tspan>
    </text>
  </g>
</svg>
