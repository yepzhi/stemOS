<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="stemGlow512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="4"/>

  <!-- Technical Ring & Grid -->
  <circle cx="256" cy="236" r="140" fill="none" stroke="rgba(56, 189, 248, 0.12)" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M100 236h312M256 80v312" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>

  <!-- stemOS Isometric Prism / Hex Emblem -->
  <g filter="url(#glow512)">
    <!-- Top & Side Facets -->
    <path d="M256 100L384 174v148l-128 74-128-74V174l128-74z" fill="rgba(2, 132, 199, 0.18)" stroke="url(#stemGlow512)" stroke-width="7" stroke-linejoin="round"/>
    <!-- Internal Axis Structure -->
    <path d="M256 396V256M384 174L256 256M128 174l128 82" stroke="url(#stemGlow512)" stroke-width="6" stroke-linecap="round"/>
    <!-- Central Node -->
    <circle cx="256" cy="256" r="26" fill="#38bdf8" filter="url(#glow512)"/>
    <circle cx="256" cy="256" r="10" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="256" y="456" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="44" fill="#f8fafc" text-anchor="middle" letter-spacing="3.5">stem<tspan fill="#38bdf8">OS</tspan></text>
</svg>
