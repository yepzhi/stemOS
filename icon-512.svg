<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="softGlow512" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad512)"/>
  <rect x="3" y="3" width="506" height="506" rx="110" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="4"/>

  <!-- Authentic stemOS Brand Mark -->
  <g filter="url(#softGlow512)">
    <text x="256" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="118" text-anchor="middle" letter-spacing="-3">
      <tspan fill="#f8fafc">stem</tspan><tspan fill="url(#cyanGrad512)">OS</tspan><tspan fill="url(#cyanGrad512)" font-size="48" font-weight="700" dy="-50">&#174;</tspan>
    </text>
  </g>
</svg>
