<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="stemGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="189" height="189" rx="40.5" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>

  <!-- Tech Blueprint Grid Accent -->
  <path d="M40 96h112M96 40v112" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5"/>
  <circle cx="96" cy="96" r="48" fill="none" stroke="rgba(56, 189, 248, 0.1)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- stemOS Isometric Prism / Hex Emblem -->
  <g filter="url(#glow)">
    <!-- Top & Side Facets -->
    <path d="M96 38L144 65v56l-48 27-48-27V65l48-27z" fill="rgba(2, 132, 199, 0.15)" stroke="url(#stemGlow)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Internal Axis -->
    <path d="M96 148V96M144 65L96 96M48 65l48 31" stroke="url(#stemGlow)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Central Processing Core -->
    <circle cx="96" cy="96" r="10" fill="#38bdf8" filter="url(#glow)"/>
    <circle cx="96" cy="96" r="4" fill="#ffffff"/>
  </g>

  <!-- Typography Accent -->
  <text x="96" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="16" fill="#f8fafc" text-anchor="middle" letter-spacing="1.5">stem<tspan fill="#38bdf8">OS</tspan></text>
</svg>
