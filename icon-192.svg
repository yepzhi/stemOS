<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bgGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad192" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="softGlow192" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad192)"/>
  <rect x="1.5" y="1.5" width="189" height="189" rx="40.5" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>

  <!-- Authentic stemOS Brand Mark -->
  <g filter="url(#softGlow192)">
    <text x="96" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, 'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="44" text-anchor="middle" letter-spacing="-1">
      <tspan fill="#f8fafc">stem</tspan><tspan fill="url(#cyanGrad192)">OS</tspan><tspan fill="url(#cyanGrad192)" font-size="18" font-weight="700" dy="-18">&#174;</tspan>
    </text>
  </g>
</svg>
